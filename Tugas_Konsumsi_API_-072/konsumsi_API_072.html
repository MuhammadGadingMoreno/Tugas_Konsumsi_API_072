<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikasi Praktikum - Asset, Mahasiswa, Peminjaman</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background:#f3f6f7; }
  .navbar { background:#0f4c5c; }
  .nav-pills .nav-link { color:#0f4c5c; }
  .nav-pills .nav-link.active { background:#0f4c5c; }
  .card { border:0; box-shadow:0 1px 3px rgba(15,76,92,.12); }
  th { white-space:nowrap; text-transform:capitalize; font-weight:600; }
  .table-responsive { max-height:65vh; }
</style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-box-seam me-2"></i>Manajemen Asset Kampus</span>
    <span class="text-white-50 small" id="apiLabel"></span>
  </div>
</nav>

<div class="container pb-5">
  <ul class="nav nav-pills mb-3" id="tabs">
    <li class="nav-item"><button class="nav-link active" data-mod="asset">Master Asset</button></li>
    <li class="nav-item"><button class="nav-link" data-mod="mahasiswa">Master Mahasiswa</button></li>
    <li class="nav-item"><button class="nav-link" data-mod="peminjaman">Transaksi Peminjaman</button></li>
  </ul>

  <div class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0" id="title"></h5>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" onclick="load()"><i class="bi bi-arrow-clockwise"></i> Muat ulang</button>
          <button class="btn btn-primary btn-sm" onclick="openForm()"><i class="bi bi-plus-lg"></i> Tambah data</button>
        </div>
      </div>
      <div class="table-responsive"><table class="table table-hover align-middle" id="tbl"></table></div>
    </div>
  </div>
</div>

<!-- Modal form -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="theForm">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="formBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal hapus -->
<div class="modal fade" id="delModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">Hapus data ini? Tindakan ini tidak bisa dibatalkan.</div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-danger" id="delOk">Hapus</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0">
    <div class="d-flex"><div class="toast-body" id="toastMsg"></div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const BASE_URL = "https://api.melangkah.my.id";
document.getElementById("apiLabel").textContent = BASE_URL.replace("https://", "");

// URL API (sesuai collection Postman)
const assetUrl = {
  read: BASE_URL + '/asset/read.php',
  create: BASE_URL + '/asset/create.php',
  update: BASE_URL + '/asset/update.php',
  detail: BASE_URL + '/asset/detail.php',
  delete: BASE_URL + '/asset/delete.php'
};
const mahasiswaUrl = {
  read: BASE_URL + '/mahasiswa/read.php',
  create: BASE_URL + '/mahasiswa/create.php',
  update: BASE_URL + '/mahasiswa/update.php',
  detail: BASE_URL + '/mahasiswa/detail.php',
  delete: BASE_URL + '/mahasiswa/delete.php'
};
const peminjamanUrl = {
  read: BASE_URL + '/peminjaman/read.php',
  create: BASE_URL + '/peminjaman/create.php'
};

// Konfigurasi field form tiap modul (tampilan form)
const MODS = {
  asset: {
    title: "Master Asset", crud: true,
    fields: [
      { k: "nama_asset", l: "Nama asset", t: "text" },
      { k: "kategori", l: "Kategori", t: "text" },
      { k: "jumlah", l: "Jumlah", t: "number" },
      { k: "kondisi", l: "Kondisi", t: "select", o: ["Baik", "Rusak Ringan", "Rusak Berat"] },
      { k: "lokasi", l: "Lokasi", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["Tersedia", "Dipinjam", "Perawatan"] }
    ]
  },
  mahasiswa: {
    title: "Master Mahasiswa", crud: true,
    fields: [
      { k: "nim", l: "NIM", t: "text" },
      { k: "nama", l: "Nama", t: "text" },
      { k: "jurusan", l: "Jurusan", t: "text" },
      { k: "angkatan", l: "Angkatan", t: "number" },
      { k: "email", l: "Email", t: "email" },
      { k: "telepon", l: "Telepon", t: "text" }
    ]
  },
  peminjaman: {
    title: "Transaksi Peminjaman", crud: false,
    fields: [
      { k: "id_mahasiswa", l: "Mahasiswa", t: "ref" },
      { k: "id_asset", l: "Asset", t: "ref" },
      { k: "jumlah", l: "Jumlah", t: "number" },
      { k: "tanggal_pinjam", l: "Tanggal pinjam", t: "date" },
      { k: "tanggal_kembali", l: "Tanggal kembali", t: "date" },
      { k: "keterangan", l: "Keterangan", t: "text" },
      { k: "status_peminjaman", l: "Status", t: "select", o: ["Pending", "Dipinjam", "Dikembalikan"] }
    ]
  }
};

let cur = "asset", delId = null;
const formModal = new bootstrap.Modal("#formModal");
const delModal = new bootstrap.Modal("#delModal");
const $ = id => document.getElementById(id);

function toast(msg) { $("toastMsg").textContent = msg; bootstrap.Toast.getOrCreateInstance($("toast")).show(); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function setTable(headers, withAction) {
  $("tbl").innerHTML = "<thead class='table-light'><tr>" + headers.map(h => "<th>" + h + "</th>").join("") +
    (withAction ? "<th class='text-end'>Aksi</th>" : "") + "</tr></thead><tbody></tbody>";
  return document.querySelector("#tbl tbody");
}
function showMessage(msg, cls) {
  $("tbl").innerHTML = '<tbody><tr><td class="text-center ' + cls + ' py-4">' + msg + '</td></tr></tbody>';
}
function actionButtons(editFn, delFn, id) {
  return "<td class='text-end text-nowrap'><button class='btn btn-sm btn-outline-primary me-1' onclick='" + editFn + "(" + id + ")'><i class='bi bi-pencil'></i></button>" +
         "<button class='btn btn-sm btn-outline-danger' onclick='" + delFn + "(" + id + ")'><i class='bi bi-trash'></i></button></td>";
}

// ===================== READ =====================
async function getAssets() {
  try {
    let response = await fetch(assetUrl.read);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    let assets = await response.json();

    let tableBody = setTable(["ID", "Nama Asset", "Kategori", "Jumlah", "Kondisi", "Lokasi", "Status"], true);
    if (!assets.length) return showMessage('Belum ada data. Klik "Tambah data" untuk membuat yang pertama.', 'text-muted');

    assets.forEach(asset => {
      let row = `<tr>
        <td>${esc(asset.id)}</td>
        <td>${esc(asset.nama_asset)}</td>
        <td>${esc(asset.kategori)}</td>
        <td>${esc(asset.jumlah)}</td>
        <td>${esc(asset.kondisi)}</td>
        <td>${esc(asset.lokasi)}</td>
        <td>${esc(asset.status)}</td>
        ${actionButtons('editAsset', 'deleteAsset', asset.id)}
      </tr>`;
      tableBody.innerHTML += row;
    });
  } catch (error) {
    console.error("Gagal mengambil data asset:", error);
    showMessage('Tidak dapat mengambil data asset.', 'text-danger');
  }
}

async function getMahasiswa() {
  try {
    let response = await fetch(mahasiswaUrl.read);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    let list = await response.json();

    let tableBody = setTable(["ID", "NIM", "Nama", "Jurusan", "Angkatan", "Email", "Telepon"], true);
    if (!list.length) return showMessage('Belum ada data. Klik "Tambah data" untuk membuat yang pertama.', 'text-muted');

    list.forEach(mhs => {
      let row = `<tr>
        <td>${esc(mhs.id)}</td>
        <td>${esc(mhs.nim)}</td>
        <td>${esc(mhs.nama)}</td>
        <td>${esc(mhs.jurusan)}</td>
        <td>${esc(mhs.angkatan)}</td>
        <td>${esc(mhs.email)}</td>
        <td>${esc(mhs.telepon)}</td>
        ${actionButtons('editMahasiswa', 'deleteMahasiswa', mhs.id)}
      </tr>`;
      tableBody.innerHTML += row;
    });
  } catch (error) {
    console.error("Gagal mengambil data mahasiswa:", error);
    showMessage('Tidak dapat mengambil data mahasiswa.', 'text-danger');
  }
}

async function getPeminjaman() {
  try {
    let response = await fetch(peminjamanUrl.read);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    let list = await response.json();

    let tableBody = setTable(["ID", "ID Mahasiswa", "ID Asset", "Jumlah", "Tanggal Pinjam", "Tanggal Kembali", "Keterangan", "Status"], false);
    if (!list.length) return showMessage('Belum ada data. Klik "Tambah data" untuk membuat yang pertama.', 'text-muted');

    list.forEach(p => {
      let row = `<tr>
        <td>${esc(p.id_peminjaman)}</td>
        <td>${esc(p.id_mahasiswa)}</td>
        <td>${esc(p.id_asset)}</td>
        <td>${esc(p.jumlah)}</td>
        <td>${esc(p.tanggal_pinjam)}</td>
        <td>${esc(p.tanggal_kembali)}</td>
        <td>${esc(p.keterangan)}</td>
        <td>${esc(p.status_peminjaman)}</td>
      </tr>`;
      tableBody.innerHTML += row;
    });
  } catch (error) {
    console.error("Gagal mengambil data peminjaman:", error);
    showMessage('Tidak dapat mengambil data peminjaman.', 'text-danger');
  }
}

function load() {
  $("title").textContent = MODS[cur].title;
  showMessage('Memuat data...', 'text-muted');
  if (cur === 'asset') getAssets();
  else if (cur === 'mahasiswa') getMahasiswa();
  else getPeminjaman();
}

// ===================== FORM =====================
// data = objek hasil detail.php (mode edit) atau kosong (mode tambah)
async function openForm(data) {
  const m = MODS[cur];
  const form = $("theForm");
  data = data || null;
  $("modalTitle").textContent = (data ? "Ubah " : "Tambah ") + m.title;
  if (data) form.dataset.id = data.id; else delete form.dataset.id;

  let h = "";
  for (const f of m.fields) {
    const v = data ? (data[f.k] ?? "") : "";
    let input;
    if (f.t === "select") {
      input = '<select class="form-select" name="' + f.k + '" required>' + f.o.map(o => '<option' + (o === v ? " selected" : "") + ">" + o + "</option>").join("") + "</select>";
    } else if (f.t === "ref") {
      input = '<select class="form-select" name="' + f.k + '" required><option value="">Memuat...</option></select>';
    } else {
      input = '<input class="form-control" name="' + f.k + '" type="' + f.t + '" value="' + esc(v) + '"' + (f.k === "keterangan" || f.k === "tanggal_kembali" ? "" : " required") + (f.t === "number" ? ' min="0"' : "") + ">";
    }
    h += '<div class="mb-3"><label class="form-label">' + f.l + "</label>" + input + "</div>";
  }
  $("formBody").innerHTML = h;
  formModal.show();

  if (cur === 'peminjaman') {
    form.elements.id_mahasiswa.innerHTML = '<option value="">Pilih mahasiswa</option>' + await getMahasiswaOptions();
    form.elements.id_asset.innerHTML = '<option value="">Pilih asset</option>' + await getAssetOptions();
  }
}

async function getMahasiswaOptions() {
  try {
    let response = await fetch(mahasiswaUrl.read);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    let list = await response.json();
    return list.map(m => `<option value="${esc(m.id)}">${esc((m.nim ? m.nim + " - " : "") + m.nama)}</option>`).join("");
  } catch (error) {
    console.error("Gagal mengambil data mahasiswa:", error);
    return "";
  }
}
async function getAssetOptions() {
  try {
    let response = await fetch(assetUrl.read);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    let list = await response.json();
    return list.map(a => `<option value="${esc(a.id)}">${esc(a.nama_asset)}</option>`).join("");
  } catch (error) {
    console.error("Gagal mengambil data asset:", error);
    return "";
  }
}

// ===================== CREATE & UPDATE =====================
$("theForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const m = MODS[cur];
  const id = this.dataset.id || '';
  const formData = {};
  for (const f of m.fields) {
    let v = this.elements[f.k].value;
    if (f.t === "number" || f.t === "ref") v = v === "" ? null : Number(v);
    formData[f.k] = v;
  }

  const urls = cur === 'asset' ? assetUrl : cur === 'mahasiswa' ? mahasiswaUrl : peminjamanUrl;

  try {
    let response;

    if (id) {
      // UPDATE
      formData.id = Number(id);
      response = await fetch(urls.update, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      toast("Data berhasil diubah");
    } else {
      // CREATE DATA BARU
      response = await fetch(urls.create, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      toast("Data berhasil ditambahkan");
    }

    this.reset();
    delete this.dataset.id;
    formModal.hide();
    load();
  } catch (error) {
    console.error('Gagal menyimpan data:', error);
    toast("Gagal menyimpan: " + error.message);
  }
});

// ===================== EDIT (ambil detail) =====================
async function fetchDetail(detailUrl, id) {
  let response = await fetch(`${detailUrl}?id=${id}`);
  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
  let data = await response.json();
  if (Array.isArray(data)) data = data[0];
  return data;
}

async function editAsset(id) {
  try {
    let asset = await fetchDetail(assetUrl.detail, id);
    if (!asset || !asset.nama_asset) throw new Error("Data asset tidak ditemukan atau struktur data salah");
    asset.id = asset.id ?? id;
    openForm(asset);
  } catch (error) {
    console.error('Gagal mengambil data asset:', error);
    toast("Terjadi kesalahan saat mengambil data asset, silakan coba lagi.");
  }
}

async function editMahasiswa(id) {
  try {
    let mhs = await fetchDetail(mahasiswaUrl.detail, id);
    if (!mhs || !mhs.nama) throw new Error("Data mahasiswa tidak ditemukan atau struktur data salah");
    mhs.id = mhs.id ?? id;
    openForm(mhs);
  } catch (error) {
    console.error('Gagal mengambil data mahasiswa:', error);
    toast("Terjadi kesalahan saat mengambil data mahasiswa, silakan coba lagi.");
  }
}

// ===================== DELETE =====================
function deleteAsset(id) { delId = id; delModal.show(); }
function deleteMahasiswa(id) { delId = id; delModal.show(); }

$("delOk").addEventListener("click", async () => {
  const deleteUrl = cur === 'asset' ? assetUrl.delete : mahasiswaUrl.delete;
  try {
    let response = await fetch(`${deleteUrl}?id=${delId}`, { method: 'DELETE' });
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    delModal.hide();
    toast("Data berhasil dihapus");
    load();
  } catch (error) {
    console.error('Gagal menghapus data:', error);
    toast("Gagal menghapus: " + error.message);
  }
});

// ===================== TAB =====================
document.querySelectorAll("#tabs .nav-link").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#tabs .nav-link").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  cur = b.dataset.mod;
  load();
}));

load();
</script>
</body>
</html>
